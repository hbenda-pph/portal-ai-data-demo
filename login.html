<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corporate Login | Portal AI Data (DEMO)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, rgba(59, 130, 246, 0.12) 0%, rgba(10, 15, 30, 0.98) 70%);
      margin: 0;
      font-family: 'Inter', sans-serif;
      color: var(--text-1, #f8fafc);
    }
    .login-container {
      width: 100%;
      max-width: 440px;
      padding: 24px;
    }
    .login-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 20px rgba(59, 130, 246, 0.15);
      position: relative;
      overflow: hidden;
    }
    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6, #06b6d4);
    }
    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 100px;
      font-size: 0.68rem;
      font-weight: 700;
      color: #60a5fa;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.2rem;
      color: #fff;
      margin-bottom: 14px;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.35);
    }
    .login-title {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0 0 6px 0;
      color: #f8fafc;
    }
    .login-sub {
      font-size: 0.825rem;
      color: #94a3b8;
      line-height: 1.5;
      margin: 0 0 24px 0;
    }
    .auth-alert {
      display: none;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.78rem;
      line-height: 1.45;
      margin-bottom: 20px;
      animation: fadeIn 0.2s ease-in-out;
    }
    .auth-alert.error {
      display: block;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }
    .auth-alert.success {
      display: block;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #86efac;
    }
    .lang-switcher {
      position: absolute;
      top: 18px;
      right: 18px;
      display: flex;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 2px;
    }
    .lang-btn {
      padding: 2px 7px;
      border-radius: 4px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
    }
    .lang-btn.active {
      background: #3b82f6;
      color: #fff;
    }
    .footer-note {
      font-size: 0.7rem;
      color: #64748b;
      text-align: center;
      margin-top: 24px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="login-card">
    <div class="lang-switcher">
      <button class="lang-btn active" id="btn-en" onclick="setLang('en')">EN</button>
      <button class="lang-btn" id="btn-es" onclick="setLang('es')">ES</button>
    </div>

    <div class="brand-icon">AI</div>
    <div class="brand-badge">Platform Partners • DEMO</div>

    <h1 class="login-title" id="lbl-title">Corporate Sign-In</h1>
    <p class="login-sub" id="lbl-sub">
      Enter your corporate email to access the platform.
    </p>

    <!-- Error / Success Alert -->
    <div id="alert-box" class="auth-alert"></div>

    <!-- Direct Email Login (SSO) -->
    <form onsubmit="handleDirectLogin(event)" style="display:flex;flex-direction:column;gap:12px">
      <input type="email" id="sso-email" placeholder="name@company.com" required autofocus
             style="width:100%;padding:12px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:rgba(15,23,42,0.8);color:#fff;font-size:0.875rem;box-sizing:border-box;outline:none;">
      <button type="submit" id="btn-login"
              style="width:100%;padding:12px 14px;border-radius:8px;border:none;background:linear-gradient(135deg, #2563eb, #1d4ed8);color:#fff;font-weight:700;font-size:0.875rem;cursor:pointer;transition:all 0.15s;box-shadow:0 4px 12px rgba(37,99,235,0.3);">
        Verify &amp; Continue
      </button>
    </form>

    <div class="footer-note" id="lbl-footer">
      🔒 Secure Enterprise Access • All sessions are encrypted.
    </div>
  </div>
</div>

<script>
let currentLang = 'en';

const TEXTS = {
  en: {
    title: "Corporate Sign-In",
    sub: "Enter your corporate email to access the platform.",
    btn: "Verify & Continue",
    placeholder: "name@company.com",
    footer: "🔒 Secure Enterprise Access • All sessions are encrypted.",
    accessDenied: "⛔ <strong>Access Denied:</strong> Invalid credentials or unauthorized account.",
    success: "✅ <strong>Identity Verified:</strong> Redirecting..."
  },
  es: {
    title: "Inicio de Sesión Corporativo",
    sub: "Ingresa tu correo corporativo para acceder a la plataforma.",
    btn: "Verificar y Continuar",
    placeholder: "nombre@empresa.com",
    footer: "🔒 Acceso Empresarial Seguro • Todas las sesiones están cifradas.",
    accessDenied: "⛔ <strong>Acceso Denegado:</strong> Credenciales inválidas o cuenta no autorizada.",
    success: "✅ <strong>Identidad Verificada:</strong> Redirigiendo..."
  }
};

function setLang(lang) {
  currentLang = lang;
  document.getElementById('btn-en').className = 'lang-btn' + (lang === 'en' ? ' active' : '');
  document.getElementById('btn-es').className = 'lang-btn' + (lang === 'es' ? ' active' : '');
  document.getElementById('lbl-title').innerHTML = TEXTS[lang].title;
  document.getElementById('lbl-sub').innerHTML = TEXTS[lang].sub;
  document.getElementById('btn-login').innerHTML = TEXTS[lang].btn;
  document.getElementById('sso-email').setAttribute('placeholder', TEXTS[lang].placeholder);
  document.getElementById('lbl-footer').innerHTML = TEXTS[lang].footer;
}

async function verifyEmailAuth(email) {
  const alertBox = document.getElementById('alert-box');
  alertBox.className = 'auth-alert';
  alertBox.style.display = 'none';

  try {
    const res = await fetch('/api/auth/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email })
    });

    const data = await res.json();

    if (res.ok && data.authorized) {
      alertBox.className = 'auth-alert success';
      alertBox.innerHTML = TEXTS[currentLang].success;
      setTimeout(() => {
        window.location.href = '/index.html';
      }, 500);
    } else {
      alertBox.className = 'auth-alert error';
      alertBox.innerHTML = data.message || TEXTS[currentLang].accessDenied;
    }
  } catch (err) {
    alertBox.className = 'auth-alert error';
    alertBox.innerHTML = "Authentication service error. Please try again.";
  }
}

function handleDirectLogin(e) {
  e.preventDefault();
  const email = document.getElementById('sso-email').value.trim();
  verifyEmailAuth(email);
}
</script>

</body>
</html>
