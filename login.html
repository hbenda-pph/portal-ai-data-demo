<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign-In | Portal AI Data (DEMO)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, rgba(59, 130, 246, 0.12) 0%, rgba(10, 15, 30, 0.98) 75%);
      margin: 0;
      font-family: 'Inter', sans-serif;
      color: var(--text-1, #f8fafc);
    }
    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }
    .login-card {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 36px 30px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      position: relative;
      overflow: hidden;
    }
    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6, #06b6d4);
    }
    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.25rem;
      color: #fff;
      margin-bottom: 16px;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.35);
    }
    .login-title {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0 0 6px 0;
      color: #f8fafc;
    }
    .login-sub {
      font-size: 0.825rem;
      color: #94a3b8;
      line-height: 1.5;
      margin: 0 0 22px 0;
    }
    .auth-alert {
      display: none;
      padding: 11px 14px;
      border-radius: 8px;
      font-size: 0.78rem;
      line-height: 1.45;
      margin-bottom: 18px;
      animation: fadeIn 0.2s ease-in-out;
    }
    .auth-alert.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
    }
    .auth-alert.success {
      display: block;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.35);
      color: #86efac;
    }
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }
    .field-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #94a3b8;
    }
    .field-input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(15, 23, 42, 0.9);
      color: #fff;
      font-size: 0.875rem;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.15s;
    }
    .field-input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
    }
    .btn-submit {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      font-weight: 700;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.15s;
      margin-top: 8px;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }
    .btn-submit:hover {
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
      transform: translateY(-1px);
    }
    .lang-switcher {
      position: absolute;
      top: 18px;
      right: 18px;
      display: flex;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 2px;
    }
    .lang-btn {
      padding: 2px 7px;
      border-radius: 4px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
    }
    .lang-btn.active {
      background: #3b82f6;
      color: #fff;
    }
    .footer-note {
      font-size: 0.7rem;
      color: #64748b;
      text-align: center;
      margin-top: 22px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="login-card">
    <div class="lang-switcher">
      <button class="lang-btn active" id="btn-en" onclick="setLang('en')">EN</button>
      <button class="lang-btn" id="btn-es" onclick="setLang('es')">ES</button>
    </div>

    <div class="brand-icon">AI</div>

    <h1 class="login-title" id="lbl-title">Sign In</h1>
    <p class="login-sub" id="lbl-sub">
      Enter your authorized credentials to access the platform.
    </p>

    <!-- Error / Success Alert -->
    <div id="alert-box" class="auth-alert"></div>

    <form onsubmit="handleFormLogin(event)">
      <div class="field-group">
        <label class="field-label" id="lbl-email-field">Email</label>
        <input type="email" id="sso-email" class="field-input" placeholder="user@domain.com" required autofocus>
      </div>

      <div class="field-group">
        <label class="field-label" id="lbl-pass-field">Access Key</label>
        <input type="password" id="sso-pass" class="field-input" placeholder="••••••••" required>
      </div>

      <button type="submit" id="btn-login" class="btn-submit">
        Continue
      </button>
    </form>

    <div class="footer-note" id="lbl-footer">
      🔒 Secure Enterprise Access • All sessions are encrypted.
    </div>
  </div>
</div>

<script>
let currentLang = 'en';

const TEXTS = {
  en: {
    title: "Sign In",
    sub: "Enter your authorized credentials to access the platform.",
    emailField: "Email",
    passField: "Access Key",
    btn: "Continue",
    footer: "🔒 Secure Enterprise Access • All sessions are encrypted.",
    accessDenied: "⛔ <strong>Access Denied:</strong> Invalid credentials or unauthorized account.",
    success: "✅ <strong>Access Granted:</strong> Redirecting..."
  },
  es: {
    title: "Iniciar Sesión",
    sub: "Ingresa tus credenciales autorizadas para acceder a la plataforma.",
    emailField: "Correo Electrónico",
    passField: "Clave de Acceso",
    btn: "Continuar",
    footer: "🔒 Acceso Empresarial Seguro • Todas las sesiones están cifradas.",
    accessDenied: "⛔ <strong>Acceso Denegado:</strong> Credenciales inválidas o cuenta no autorizada.",
    success: "✅ <strong>Acceso Concedido:</strong> Redirigiendo..."
  }
};

function setLang(lang) {
  currentLang = lang;
  document.getElementById('btn-en').className = 'lang-btn' + (lang === 'en' ? ' active' : '');
  document.getElementById('btn-es').className = 'lang-btn' + (lang === 'es' ? ' active' : '');
  document.getElementById('lbl-title').innerHTML = TEXTS[lang].title;
  document.getElementById('lbl-sub').innerHTML = TEXTS[lang].sub;
  document.getElementById('lbl-email-field').innerHTML = TEXTS[lang].emailField;
  document.getElementById('lbl-pass-field').innerHTML = TEXTS[lang].passField;
  document.getElementById('btn-login').innerHTML = TEXTS[lang].btn;
  document.getElementById('lbl-footer').innerHTML = TEXTS[lang].footer;
}

async function verifyLogin(email, pass) {
  const alertBox = document.getElementById('alert-box');
  alertBox.className = 'auth-alert';
  alertBox.style.display = 'none';

  try {
    const res = await fetch('/api/auth/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, pass: pass })
    });

    const data = await res.json();

    if (res.ok && data.authorized) {
      alertBox.className = 'auth-alert success';
      alertBox.innerHTML = TEXTS[currentLang].success;
      setTimeout(() => {
        window.location.href = '/index.html';
      }, 500);
    } else {
      alertBox.className = 'auth-alert error';
      alertBox.innerHTML = data.message || TEXTS[currentLang].accessDenied;
    }
  } catch (err) {
    alertBox.className = 'auth-alert error';
    alertBox.innerHTML = "Authentication service error. Please try again.";
  }
}

function handleFormLogin(e) {
  e.preventDefault();
  const email = document.getElementById('sso-email').value.trim();
  const pass = document.getElementById('sso-pass').value.trim();
  verifyLogin(email, pass);
}
</script>

</body>
</html>
